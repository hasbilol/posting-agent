name: Auto Post to Threads

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (no publish, no history write)"
        required: false
        type: boolean
        default: false
  schedule:
    # 12:30 PM MYT (04:30 UTC) and 8:30 PM MYT (12:30 UTC)
    - cron: "30 4,12 * * *"

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post-agent:
    name: Run posting pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL || 'auto' }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      AFFILIATE_LINK_TEMPLATE: ${{ vars.AFFILIATE_LINK_TEMPLATE || secrets.AFFILIATE_LINK_TEMPLATE || 'https://shopee.com.my/product/affiliate/{item_id}' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity-check imports
        run: python -c "from src.graph import app; import main; print('modules OK')"

      - name: Run posting agent
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Auto-commit posted history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update posted history"
            git push
          fi
